LTER TABLE public.events ADD COLUMN IF NOT EXISTS link TEXT;\n    ALTER TABLE public.events ADD COLUMN IF NOT EXISTS budget BIGINT DEFAULT 0;\n    ALTER TABLE public.events ADD COLUMN IF NOT EXISTS status TEXT DEFAULT 'live';\n    ALTER TABLE public.events ADD COLUMN IF NOT EXISTS source_url TEXT;\n    ALTER TABLE public.events ADD COLUMN IF NOT EXISTS poster_url TEXT;\n    ALTER TABLE public.events ADD COLUMN IF NOT EXISTS org_name TEXT DEFAULT '공공기관';\n    ALTER TABLE public.events ADD COLUMN IF NOT EXISTS shield_rule TEXT DEFAULT 'K-Gift Shield 부정참여 방지 정책 적용';\nEXCEPTION\n    WHEN duplicate_column THEN RAISE NOTICE 'column already exists';\nEND $$;\n\n\n-- ------------------------------------------------------------------------------\n-- 3. 공공 불변 감사 로그 테이블 (public.audit_logs) 생성 및 컬럼 보강\n-- ------------------------------------------------------------------------------\nCREATE TABLE IF NOT EXISTS public.audit_logs (\n    id TEXT PRIMARY KEY,                       -- 고유 식별자 (예: AUD-0001)\n    role TEXT NOT NULL DEFAULT 'admin',        -- 작업자 역할 (admin / draft / appr / system)\n    actor TEXT NOT NULL,                      -- 작업자 명칭 및 소속\n    type TEXT NOT NULL,                       -- 감사 분류 (project / appr / payment / vendor / fee / gatekeeper / sec)\n    title TEXT NOT NULL,                      -- 감사 작업 제목\n    detail TEXT DEFAULT '',                   -- 상세 내역 (변경 전/후 대조값 등)\n    meta TEXT DEFAULT '',                     -- 시스템 메타정보 / 인증 해시\n    at TEXT NOT NULL,                         -- 초 단위 기록 시각 (YYYY-MM-DD HH:mm:ss)\n    hash TEXT NOT NULL,                       -- 단방향 무결성 검증 해시 (SHA-256 / 0x...)\n    immutable BOOLEAN NOT NULL DEFAULT TRUE,  -- 위·변조 불가 보증 플래그\n    created_at TIMESTAMPTZ DEFAULT TIMEZONE('utc'::text, NOW())\n);\n\nDO $$\nBEGIN\n    ALTER TABLE public.audit_logs ADD COLUMN IF NOT EXISTS role TEXT DEFAULT 'admin';\n    ALTER TABLE public.audit_logs ADD COLUMN IF NOT EXISTS actor TEXT;\n    ALTER TABLE public.audit_logs ADD COLUMN IF NOT EXISTS type TEXT;\n    ALTER TABLE public.audit_logs ADD COLUMN IF NOT EXISTS title TEXT;\n    ALTER TABLE public.audit_logs ADD COLUMN IF NOT EXISTS detail TEXT DEFAULT '';\n    ALTER TABLE public.audit_logs ADD COLUMN IF NOT EXISTS meta TEXT DEFAULT '';\n    ALTER TABLE public.audit_logs ADD COLUMN IF NOT EXISTS at TEXT;\n    ALTER TABLE public.audit_logs ADD COLUMN IF NOT EXISTS hash TEXT;\n    ALTER TABLE public.audit_logs ADD COLUMN IF NOT EXISTS immutable BOOLEAN DEFAULT TRUE;\nEXCEPTION\n    WHEN duplicate_column THEN RAISE NOTICE 'column already exists';\nEND $$;\n\n\n-- ------------------------------------------------------------------------------\n-- 4. 사용자 프로필 테이블 (public.profiles) 생성 및 컬럼 보강\n-- ------------------------------------------------------------------------------\nCREATE TABLE IF NOT EXISTS public.profiles (\n    id UUID PRIMARY KEY,\n    display_name TEXT,\n    role TEXT DEFAULT 'admin',                 -- admin / drafter / approver / user\n    is_active BOOLEAN DEFAULT TRUE,\n    created_at TIMESTAMPTZ DEFAULT TIMEZONE('utc'::text, NOW())\n);\n\n\n-- ------------------------------------------------------------------------------\n-- 5. 테이블 및 시퀀스 권한 부여 (GRANT)\n-- ------------------------------------------------------------------------------\nGRANT ALL ON TABLE public.events TO anon, authenticated, service_role;\nGRANT ALL ON TABLE public.audit_logs TO anon, authenticated, service_role;\nGRANT ALL ON TABLE public.profiles TO anon, authenticated, service_role;\n\nGRANT ALL ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;\n\n\n-- ------------------------------------------------------------------------------\n-- 6. Row-Level Security (RLS) 및 불변 거버넌스 정책 확립\n-- ------------------------------------------------------------------------------\n\n-- (1) events 테이블 RLS 설정\nALTER TABLE public.events ENABLE ROW LEVEL SECURITY;\n\nDROP POLICY IF EXISTS \"events_public_select\" ON public.events;\nCREATE POLICY \"events_public_select\" ON public.events\n    FOR SELECT TO public\n    USING (true);\n\nDROP POLICY IF EXISTS \"events_public_insert\" ON public.events;\nCREATE POLICY \"events_public_insert\" ON public.events\n    FOR INSERT TO public\n    WITH CHECK (true);\n\n-- (v58) events UPDATE 정책 없음: 아무나 이벤트를 수정할 수 없습니다.\nDROP POLICY IF EXISTS \"events_public_update\" ON public.events;\n\n\n-- (2) audit_logs 테이블 RLS 설정 (핵심: UPDATE 및 DELETE 영구 차단 - Append-Only)\nALTER TABLE public.audit_logs ENABLE ROW LEVEL SECURITY;\n\nDROP POLICY IF EXISTS \"audit_logs_public_select\" ON public.audit_logs;\nCREATE POLICY \"audit_logs_public_select\" ON public.audit_logs\n    FOR SELECT TO public\n    USING (true);\n\nDROP POLICY IF EXISTS \"audit_logs_public_insert\" ON public.audit_logs;\nCREATE POLICY \"audit_logs_public_insert\" ON public.audit_logs\n    FOR INSERT TO public\n    WITH CHECK (immutable IS TRUE AND length(coalesce(hash, '')) > 0);\n\n-- ※ 주의: audit_logs 테이블에는 UPDATE 및 DELETE 정책을 일체 작성하지 않습니다.\n-- 데이터베이스 엔진 레벨에서 UPDATE 및 DELETE 시도가 원천 거부(Reject)되어\n-- 감사원 및 공공 감사 기준 100% 무결성 원본이 영구 보존됩니다.\n\n\n-- (3) profiles 테이블 RLS 설정\nALTER TABLE public.profiles ENABLE ROW LEVEL SECURITY;\n\nDROP POLICY IF EXISTS \"profiles_public_select\" ON public.profiles;\nCREATE POLICY \"profiles_public_select\" ON public.profiles\n    FOR SELECT TO public\n    USING (true);\n\n-- (v58) profiles INSERT/UPDATE 정책 없음: 아무나 role 을 admin 으로 바꾸거나 admin 프로필을 만들 수 없습니다.\nDROP POLICY IF EXISTS \"profiles_public_insert\" ON public.profiles;\nDROP POLICY IF EXISTS \"profiles_public_update\" ON public.profiles;\n\n\n-- ------------------------------------------------------------------------------\n-- 6-1. (v58) 중복 적재 방지 + owner_id + 쓰기 권한 회수\n-- ------------------------------------------------------------------------------\nALTER TABLE public.events ADD COLUMN IF NOT EXISTS dedup_hash TEXT;\nALTER TABLE public.events ADD COLUMN IF NOT EXISTS owner_id UUID;\nDO $$\nBEGIN\n    IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'events_dedup_hash_key' AND conrelid = 'public.events'::regclass) THEN\n        ALTER TABLE public.events ADD CONSTRAINT events_dedup_hash_key UNIQUE (dedup_hash);\n    END IF;\nEND $$;\n\nREVOKE UPDATE, DELETE, TRUNCATE ON TABLE public.audit_logs FROM anon, authenticated;\nREVOKE UPDATE, DELETE, TRUNCATE ON TABLE public.profiles FROM anon, authenticated;\nGRANT UPDATE (display_name) ON TABLE public.profiles TO authenticated;  -- 본인 프로필은 이름만 수정 가능 (role·is_active 는 직접 수정 불가)\nREVOKE TRUNCATE ON TABLE public.events FROM anon, authenticated;\nREVOKE UPDATE, DELETE ON TABLE public.events FROM anon;\nGRANT UPDATE, DELETE ON TABLE public.events TO authenticated;  -- 로그인 사용자는 events_update/events_delete 정책(조직·역할 검사) 범위 안에서만 가능\nREVOKE INSERT ON TABLE public.profiles FROM anon, authenticated;\n\n\n-- ------------------------------------------------------------------------------\n-- 7. 시연 및 검증용 초기 시드(Seed) 데이터 탑재 (안전 트랜잭션 블록)\n-- ------------------------------------------------------------------------------\n\n-- (1) 서울시 수집 이벤트 기본 시드 데이터 (target_ages: text[] 호환 반영)\nDO $$\nBEGIN\n    IF NOT EXISTS (SELECT 1 FROM public.events WHERE title LIKE '%내 손안에 서울%') THEN\n        INSERT INTO public.events (\n            title, tpl, target_region, target_ages, start_date, end_date, \n            prizes, link, budget, status, org_name, poster_url, shield_rule\n        )\n        VALUES (\n            '내 손안에 서울 - 빈칸 채우기 퀴즈 이벤트 (한강 위 ''○○ 버스'')',\n            '시민참여 / 정책퀴즈',\n            '서울특별시',\n            ARRAY['ALL']::text[],\n            '2026-10-13',\n            '2026-10-19',\n            '[{\"n\": \"서울사랑상품권(모바일) 5,000원권\", \"q\": 50, \"u\": 5000}]',\n            'https://naver.me/GUTiHHRH',\n            250000,\n            'live',\n            '서울특별시',\n            'https://mediahub.seoul.go.kr/uploads/mediahub/2026/08/mFZtpwMTvUyUZaVmaTcgguGBdKSAYLIy.png',\n            '명의도용 및 부적절한 방법으로 참여 시 당첨 취소 (K-Gift Shield 자동 검증)'\n        );\n    END IF;\nEXCEPTION\n    WHEN OTHERS THEN\n        RAISE NOTICE '초기 이벤트 시드 삽입 건너뜀 (이미 데이터가 존재하거나 기타): %', SQLERRM;\nEND $$;\n\n-- (2) 감사 로그 초기 거버넌스 시드 데이터\nDO $$\nBEGIN\n    INSERT INTO public.audit_logs (\n        id, role, actor, type, title, detail, meta, at, hash, immutable\n    )\n    VALUES (\n        'AUD-0001',\n        'system',\n        'K-기프트 무결성 엔진 (시스템 초기화)',\n        'sec',\n        'Supabase 클라우드 불변 감사 데이터베이스 인프라 활성화',\n        '공공 BaaS 클라우드 RLS(Row-Level Security) 보호 기반 감사 로그 엔진 가동 및 암호화 해시 검증 완료',\n        'ACTION: INIT_AUDIT_TRAIL · HASH_ALGO: SHA-256',\n        '2026-10-13 09:00:00',\n        '0x9E7D4B1A8C2F5E0D',\n        TRUE\n    )\n    ON CONFLICT (id) DO NOTHING;\nEXCEPTION\n    WHEN OTHERS THEN\n        RAISE NOTICE '초기 감사 로그 시드 삽입 건너뜀: %', SQLERRM;\nEND $$;\n\n-- 완료 확인 메시지\nSELECT 'K-Gift Supabase 데이터베이스 스키마 및 RLS 권한 설정이 성공적으로 완료되었습니다!' AS result;\n\n-- ==============================================================================\n-- [중요] 위 스키마는 초기 버전입니다. 반드시 아래 v59 보안 패치까지 이어서 실행하세요.\n-- ==============================================================================\n-- ==============================================================================\n-- [K-Gift] Supabase 보안·중복 방지 패치 (v59)\n-- 이미 만들어진 DB(pvcarkmnbttcgosmhwng)에 그대로 붙여넣고 [Run] 하면 됩니다. 여러 번 실행해도 안전합니다.\n--\n-- 이 패치가 하는 일\n--   1) events.dedup_hash 컬럼 + UNIQUE 제약 추가  -> hunter를 다시 돌려도 같은 이벤트가 중복 적재되지 않음\n--   2) events.owner_id 컬럼 추가                    -> hunter가 보내는 owner_id 때문에 적재가 실패하는 문제 방지\n--   3) events / profiles 의 \"누구나 UPDATE\" 정책 삭제 -> 아무나 role을 admin으로 바꾸거나 이벤트를 고치는 것 차단\n--   4) profiles 의 \"누구나 INSERT\" 정책 삭제          -> 아무나 admin 프로필을 만드는 것 차단\n--   5) audit_logs INSERT 조건 강화 + UPDATE/DELETE 권한 회수 -> 진짜 Append-Only\n-- ==============================================================================\n\n-- 1) 중복 방지 -----------------------------------------------------------------\nALTER TABLE public.events ADD COLUMN IF NOT EXISTS dedup_hash TEXT;\n\nDO $$\nBEGIN\n    IF NOT EXISTS (\n        SELECT 1 FROM pg_constraint\n        WHERE conname = 'events_dedup_hash_key' AND conrelid = 'public.events'::regclass\n    ) THEN\n        ALTER TABLE public.events ADD CONSTRAINT events_dedup_hash_key UNIQUE (dedup_hash);\n    END IF;\nEND $$;\n-- (NULL 은 여러 개 허용되므로 예전에 적재된 행은 그대로 둡니다.)\n\n-- 2) hunter 가 보내는 owner_id 컬럼 ----------------------------------------------\nALTER TABLE public.events ADD COLUMN IF NOT EXISTS owner_id UUID;\n\n-- 3) events / profiles 쓰기 정책 정리 ---------------------------------------------\nDROP POLICY IF EXISTS \"events_public_update\"   ON public.events;\nDROP POLICY IF EXISTS \"profiles_public_update\" ON public.profiles;\nDROP POLICY IF EXISTS \"profiles_public_insert\" ON public.profiles;\n\n-- 4) audit_logs: 조건 있는 INSERT 만 허용 -------------------------------------------\nDROP POLICY IF EXISTS \"audit_logs_public_insert\" ON public.audit_logs;\nCREATE POLICY \"audit_logs_public_insert\" ON public.audit_logs\n    FOR INSERT TO public\n    WITH CHECK (immutable IS TRUE AND length(coalesce(hash, '')) > 0);\n\n-- 5) 권한(GRANT) 회수: 정책이 없어도 권한 자체를 막아 이중 잠금 ---------------------\nREVOKE UPDATE, DELETE, TRUNCATE ON TABLE public.audit_logs FROM anon, authenticated;\nREVOKE UPDATE, DELETE, TRUNCATE ON TABLE public.profiles FROM anon, authenticated;\nGRANT UPDATE (display_name) ON TABLE public.profiles TO authenticated;  -- 본인 프로필은 이름만 수정 가능 (role·is_active 는 직접 수정 불가)\nREVOKE TRUNCATE ON TABLE public.events FROM anon, authenticated;\nREVOKE UPDATE, DELETE ON TABLE public.events FROM anon;\nGRANT UPDATE, DELETE ON TABLE public.events TO authenticated;  -- 로그인 사용자는 events_update/events_delete 정책(조직·역할 검사) 범위 안에서만 가능\nREVOKE INSERT ON TABLE public.profiles FROM anon, authenticated;\n\n-- 확인: 남아 있는 정책 목록 (UPDATE/DELETE 정책이 보이면 안 됩니다)\nSELECT tablename, policyname, cmd FROM pg_policies\nWHERE schemaname = 'public' AND tablename IN ('events', 'profiles', 'audit_logs')\nORDER BY tablename, cmd;\n\n-- ------------------------------------------------------------------------------\n-- 참고(선택): 예전 hunter 실행으로 이미 쌓인 중복 행을 지우려면 아래 주석을 풀고 실행하세요.\n-- 같은 source_url 중 가장 오래된 1건만 남깁니다. (지우기 전에 SELECT 로 먼저 확인 권장)\n--\n-- DELETE FROM public.events e USING public.events k\n-- WHERE e.source_url IS NOT NULL AND e.source_url = k.source_url AND e.id > k.id;\n-- ------------------------------------------------------------------------------\n-- 한계: 지금은 시연용이라 hunter 가 공개(anon) 키로 INSERT 합니다.\n-- 실제 운영에서는 hunter 를 서버에서 service_role 키로 돌리고 events INSERT 정책도 닫으세요.\n", "mail_server_py_content": "# -*- coding: utf-8 -*-\nimport http.server\nimport socketserver\nimport json\nimport urllib.parse\nimport smtplib\nfrom email.mime.text import MIMEText\nfrom email.mime.multipart import MIMEMultipart\nfrom email.header import Header\nfrom email.utils import formataddr\nimport os\nimport sys\n\nCONFIG_FILE = 'mail_config.json'\nPORT = 8080\n\ndef load_config():\n    if os.path.exists(CONFIG_FILE):\n        try:\n            with open(CONFIG_FILE, 'r', encoding='utf-8') as f:\n                return json.load(f)\n        except Exception:\n            pass\n    return {\n        \"sender_email\": \"vibration200@naver.com\",\n        \"naver_id\": \"vibration200\",\n        \"naver_pw\": \"\",\n        \"smtp_host\": \"smtp.naver.com\",\n        \"smtp_port\": 465\n    }\n\ndef save_config(cfg):\n    with open(CONFIG_FILE, 'w', encoding='utf-8') as f:\n        json.dump(cfg, f, indent=2, ensure_ascii=False)\n\ndef send_naver_email(to_email, code, name=\"사용자\"):\n    cfg = load_config()\n    naver_id = cfg.get(\"naver_id\", \"vibration200\")\n    naver_pw = cfg.get(\"naver_pw\", \"\")\n    sender = cfg.get(\"sender_email\", \"vibration200@naver.com\")\n\n    if not naver_pw:\n        return False, \"네이버 계정 비밀번호가 설정되지 않았습니다.\"\n\n    subject = f\"[K-이벤트 매니저] 회원가입 본인확인 인증번호 [{code}]\"\n    \n    html_content = f\"\"\"<!DOCTYPE html>\n<html>\n<head><meta charset=\"UTF-8\"></head>\n<body style=\"margin:0;padding:24px;background-color:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif\">\n  <div style=\"max-width:540px;margin:0 auto;background:#ffffff;border-radius:16px;padding:36px 32px;box-shadow:0 8px 24px rgba(0,0,0,0.06);border:1px solid #e5e9f2\">\n    <div style=\"display:flex;align-items:center;margin-bottom:24px\">\n      <div style=\"background:#0A84FF;color:#ffffff;font-size:20px;font-weight:bold;width:44px;height:44px;border-radius:10px;text-align:center;line-height:44px;display:inline-block\">K</div>\n      <div style=\"margin-left:12px;display:inline-block;vertical-align:middle\">\n        <h2 style=\"margin:0;font-size:18px;color:#111\">K-이벤트 매니저</h2>\n        <span style=\"font-size:12px;color:#777\">공공기관 이벤트 운영 플랫폼</span>\n      </div>\n    </div>\n    <hr style=\"border:0;border-top:1px solid #eee;margin:16px 0 24px 0\">\n    <p style=\"font-size:15px;color:#333;line-height:1.6;margin:0 0 16px 0\">\n      안녕하세요, <b>{name}</b>님!<br>\n      K-이벤트 매니저 공공 서비스 회원가입을 위한 본인확인 인증번호입니다.\n    </p>\n    <p style=\"font-size:14px;color:#555;line-height:1.5;margin:0 0 24px 0\">\n      화면의 인증번호 입력창에 아래 <b>4자리 숫자</b>를 입력해 주세요.\n    </p>\n    <div style=\"text-align:center;background:#f0f5ff;border:2px dashed #0A84FF;border-radius:12px;padding:20px 0;margin-bottom:24px\">\n      <div style=\"font-size:13px;color:#0A84FF;font-weight:700;margin-bottom:6px\">인증번호 4자리</div>\n      <div style=\"font-size:38px;font-weight:900;letter-spacing:14px;color:#0048ba;padding-left:14px\">{code}</div>\n    </div>\n    <p style=\"font-size:12.5px;color:#888;line-height:1.6;margin:0\">\n      • 인증번호의 유효 시간은 발송 후 <b>3분</b>입니다.<br>\n      • 본인이 요청한 인증이 아닌 경우 본 메일을 무시해 주시기 바랍니다.<br>\n      • 발신 전용 메일이며 회신되지 않습니다.\n    </p>\n    <div style=\"margin-top:28px;padding-top:16px;border-top:1px solid #f0f0f0;font-size:11.5px;color:#aaa;text-align:center\">\n      발신 관리자: {sender} | © 2026 K-Event Manager Pro\n    </div>\n  </div>\n</body>\n</html>\"\"\"\n\n    try:\n        msg = MIMEMultipart('alternative')\n        msg['Subject'] = Header(subject, 'utf-8')\n        msg['From'] = formataddr(('K-Event Manager', sender))\n        msg['To'] = to_email\n\n        part = MIMEText(html_content, 'html', 'utf-8')\n        msg.attach(part)\n\n        smtp_host = cfg.get(\"smtp_host\", \"smtp.naver.com\")\n        smtp_port = cfg.get(\"smtp_port\", 465)\n        \n        with smtplib.SMTP_SSL(smtp_host, smtp_port, timeout=12) as server:\n            server.login(naver_id, naver_pw)\n            server.sendmail(sender, [to_email], msg.as_string())\n\n        return True, f\"{sender}에서 {to_email}로 실제 네이버 인증 메일이 발송되었습니다!\"\n\n    except Exception as e:\n        return False, f\"메일 발송 오류 ({type(e).__name__}): {str(e)}\"\n\n\nclass KEventRequestHandler(http.server.SimpleHTTPRequestHandler):\n    def end_headers(self):\n        self.send_header('Access-Control-Allow-Origin', '*')\n        self.send_header('Access-Control-Allow-Methods', 'GET, POST, OPTIONS')\n        self.send_header('Access-Control-Allow-Headers', 'Content-Type')\n        super().end_headers()\n\n    def do_OPTIONS(self):\n        self.send_response(200)\n        self.end_headers()\n\n    def do_GET(self):\n        if self.path == '/api/mail-status':\n            cfg = load_config()\n            resp = {\n                \"configured\": bool(cfg.get(\"naver_pw\")),\n                \"sender_email\": cfg.get(\"sender_email\", \"vibration200@naver.com\"),\n                \"naver_id\": cfg.get(\"naver_id\", \"vibration200\")\n            }\n            self.send_response(200)\n            self.send_header('Content-Type', 'application/json; charset=utf-8')\n            self.end_headers()\n            self.wfile.write(json.dumps(resp, ensure_ascii=False).encode('utf-8'))\n            return\n        return super().do_GET()\n\n    def do_POST(self):\n        content_length = int(self.headers.get('Content-Length', 0))\n        post_data = self.rfile.read(content_length)\n        \n        try:\n            body = json.loads(post_data.decode('utf-8')) if post_data else {}\n        except Exception:\n            body = {}\n\n        if self.path == '/api/send-otp':\n            to_email = body.get('to', '').strip()\n            code = body.get('code', '').strip()\n            name = body.get('name', '시민 사용자').strip()\n\n            if not to_email or not code:\n                self.send_response(400)\n                self.send_header('Content-Type', 'application/json; charset=utf-8')\n                self.end_headers()\n                self.wfile.write(json.dumps({\"ok\": False, \"msg\": \"수신 이메일과 인증번호가 필요합니다.\"}, ensure_ascii=False).encode('utf-8'))\n                return\n\n            cfg = load_config()\n            if not cfg.get(\"naver_pw\"):\n                self.send_response(200)\n                self.send_header('Content-Type', 'application/json; charset=utf-8')\n                self.end_headers()\n                self.wfile.write(json.dumps({\n                    \"ok\": False,\n                    \"need_config\": True,\n                    \"msg\": \"네이버 계정 비밀번호가 설정되지 않았습니다.\"\n                }, ensure_ascii=False).encode('utf-8'))\n                return\n\n            ok, msg = send_naver_email(to_email, code, name)\n            self.send_response(200 if ok else 400)\n            self.send_header('Content-Type', 'application/json; charset=utf-8')\n            self.end_headers()\n            self.wfile.write(json.dumps({\"ok\": ok, \"msg\": msg}, ensure_ascii=False).encode('utf-8'))\n            return\n\n        if self.path == '/api/save-mail-config':\n            naver_pw = body.get('naver_pw', '').strip()\n            if not naver_pw:\n                self.send_response(400)\n                self.send_header('Content-Type', 'application/json; charset=utf-8')\n                self.end_headers()\n                self.wfile.write(json.dumps({\"ok\": False, \"msg\": \"비밀번호를 입력해 주세요.\"}, ensure_ascii=False).encode('utf-8'))\n                return\n\n            cfg = load_config()\n            cfg[\"naver_pw\"] = naver_pw\n            save_config(cfg)\n\n            naver_id = cfg.get(\"naver_id\", \"vibration200\")\n            smtp_host = cfg.get(\"smtp_host\", \"smtp.naver.com\")\n            smtp_port = cfg.get(\"smtp_port\", 465)\n\n            try:\n                with smtplib.SMTP_SSL(smtp_host, smtp_port, timeout=8) as server:\n                    server.login(naver_id, naver_pw)\n                self.send_response(200)\n                self.send_header('Content-Type', 'application/json; charset=utf-8')\n                self.end_headers()\n                self.wfile.write(json.dumps({\n                    \"ok\": True,\n                    \"msg\": f\"네이버 SMTP 서버 연결 및 인증 성공! (vibration200@naver.com)\"\n                }, ensure_ascii=False).encode('utf-8'))\n            except Exception as e:\n                self.send_response(400)\n                self.send_header('Content-Type', 'application/json; charset=utf-8')\n                self.end_headers()\n                self.wfile.write(json.dumps({\n                    \"ok\": False,\n                    \"msg\": f\"네이버 연결 오류: {str(e)}\"\n                }, ensure_ascii=False).encode('utf-8'))\n            return\n\n        self.send_response(404)\n        self.end_headers()\n\n\ndef run_server():\n    sys.stdout.reconfigure(encoding='utf-8')\n    print(f\"[*] Starting K-Event Manager Server with Naver SMTP API on port {PORT}...\")\n    server = socketserver.TCPServer((\"\", PORT), KEventRequestHandler)\n    print(f\"[+] Server running at http://localhost:{PORT}/\")\n    print(f\"[+] Naver Mail Sender: vibration200@naver.com (smtp.naver.com:465)\")\n    server.serve_forever()\n\nif __name__ == '__main__':\n    run_server()\n", "test_supabase_py_content": "\"\"\"\nSupabase 클라우드 데이터베이스 연동 상태 검증 스크립트\n- 대상 인스턴스: https://pvcarkmnbttcgosmhwng.supabase.co\n- 테스트 대상: events, audit_logs, profiles 테이블의 권한(SELECT, INSERT) 상태 점검\n\"\"\"\n\nimport urllib.request\nimport urllib.parse\nimport json\nimport ssl\nimport sys\n\ndef run_tests():\n    sys.stdout.reconfigure(encoding='utf-8')\n    ctx = ssl._create_unverified_context()\n    base_url = 'https://pvcarkmnbttcgosmhwng.supabase.co'\n    key = 'sb_publishable_o1WcoXAZ2aIwZdKqkOO0lg_VxBt6CeZ'\n    headers = {\n        'apikey': key,\n        'Authorization': f'Bearer {key}',\n        'Content-Type': 'application/json',\n        'Prefer': 'return=representation'\n    }\n\n    print(\"==================================================================\")\n    print(\"[*] K-Gift 플랫폼 Supabase 클라우드 데이터베이스 연동 권한 검증\")\n    print(f\"[*] 대상 URL: {base_url}\")\n    print(\"==================================================================\\n\")\n\n    tables = ['events', 'audit_logs', 'profiles']\n    all_passed = True\n\n    # 1. SELECT 권한 테스트\n    for tbl in tables:\n        url = f\"{base_url}/rest/v1/{tbl}?select=*&limit=1\"\n        req = urllib.request.Request(url, headers=headers, method=\"GET\")\n        try:\n            with urllib.request.urlopen(req, context=ctx, timeout=10) as resp:\n                res = resp.read().decode('utf-8')\n                data = json.loads(res) if res else []\n                print(f\"[+] [성공] public.{tbl} 조회(SELECT) 권한 승인됨 (Status: {resp.status}, 레코드 수: {len(data)})\")\n        except urllib.error.HTTPError as e:\n            all_passed = False\n            err_body = e.read().decode('utf-8', errors='ignore')\n            print(f\"[-] [실패] public.{tbl} 조회(SELECT) 오류: HTTP {e.code}\")\n            if e.code == 401 or \"42501\" in err_body:\n                print(f\"    -> 원인: PostgreSQL 권한 거부 (RLS 또는 GRANT 누락). SQL Editor에서 스크립트를 실행해 주세요.\")\n            else:\n                print(f\"    -> 세부 오류: {err_body}\")\n        except Exception as e:\n            all_passed = False\n            print(f\"[-] [실패] public.{tbl} 통신 실패: {e}\")\n\n    print(\"\\n------------------------------------------------------------------\")\n    if all_passed:\n        print(\"[★] 축하합니다! Supabase 권한 설정이 완료되어 모든 테이블과 정상 통신합니다.\")\n        print(\"    -> 이제 kgift_hunter.py 실행 시 즉시 Supabase 클라우드에 적재됩니다.\")\n        print(\"    -> K-Event Manager Pro 웹앱에서 실시간 동기화가 활성화됩니다.\")\n    else:\n        print(\"[!] 안내: 아직 Supabase 대시보드에서 권한 설정 SQL이 실행되지 않았습니다.\")\n        print(\"    1. Supabase Dashboard (https://supabase.com/dashboard/project/pvcarkmnbttcgosmhwng)에 접속합니다.\")\n        print(\"    2. 좌측 메뉴 [SQL Editor]를 클릭합니다.\")\n        print(\"    3. 프로젝트 폴더의 'supabase_schema_and_permissions.sql' 파일 내용을 복사하여 실행([Run])해 주세요.\")\n    print(\"==================================================================\")\n\nif __name__ == \"__main__\":\n    run_tests()\n"};

// 2. 브라우저 내장 실시간 Supabase 연결 및 권한 진단기 (test_supabase_connection.py 웹 포팅)
window.runInBrowserSupabaseTest = async function(outputElemId) {
  const output = document.getElementById(outputElemId);
  const log = (msg, color) => {
    if (!output) return;
    const div = document.createElement('div');
    div.style.color = color || '#CFE4FF';
    div.style.marginBottom = '4px';
    div.textContent = msg;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
  };

  if (output) output.innerHTML = '';
  log('==================================================================', '#8A9EB3');
  log('[*] K-Gift Supabase 클라우드 실시간 권한 및 통신 검증 (In-Browser Test)', '#0A84FF');
  log('[*] 대상 URL: https://pvcarkmnbttcgosmhwng.supabase.co', '#8A9EB3');
  log('==================================================================', '#8A9EB3');

  const base_url = 'https://pvcarkmnbttcgosmhwng.supabase.co';
  const key = 'sb_publishable_o1WcoXAZ2aIwZdKqkOO0lg_VxBt6CeZ';
  const headers = {
    'apikey': key,
    'Authorization': 'Bearer ' + key,
    'Content-Type': 'application/json'
  };

  const tables = ['events', 'audit_logs', 'profiles'];
  let all_passed = true;

  for (const tbl of tables) {
    const url = base_url + '/rest/v1/' + tbl + '?select=*&limit=1';
    try {
      const startT = performance.now();
      const res = await fetch(url, { headers, method: 'GET' });
      const endT = performance.now();
      const elapsed = Math.round(endT - startT);
      if (res.ok) {
        const data = await res.json().catch(() => []);
        log('[+] [성공] public.' + tbl + ' 조회(SELECT) 권한 승인됨 (Status: ' + res.status + ', 지연시간: ' + elapsed + 'ms, 샘플: ' + data.length + '건)', '#30D158');
      } else {
        all_passed = false;
        const errText = await res.text().catch(() => '');
        log('[-] [실패] public.' + tbl + ' 조회 오류: HTTP ' + res.status + ' (' + errText.slice(0, 100) + ')', '#FF453A');
      }
    } catch(e) {
      all_passed = false;
      log('[-] [오류] public.' + tbl + ' 통신 실패: ' + e.message, '#FF453A');
    }
  }

  log('------------------------------------------------------------------', '#8A9EB3');
  if (all_passed) {
    log('[★] 진단 완료: Supabase RLS 및 모든 테이블 통신이 100% 정상 승인 상태입니다.', '#FFD60A');
    log('    -> 이벤트 수집 데이터 적재 및 불변 감사 로그 실시간 보관이 완벽히 가동 중입니다.', '#30D158');
  } else {
    log('[!] 일부 테이블에 권한 문제가 감지되었습니다. 상단 [SQL 스키마]를 Supabase SQL Editor에서 실행해 주세요.', '#FF9F0A');
  }
};

  }
  
  modal.style.display = 'flex';
  switchAioTab(defaultTab || 'diag');
  if (!defaultTab || defaultTab === 'diag') {
    window.runInBrowserSupabaseTest('aio_diag_output');

};

window.switchAioTab = function(tabName) {
  const tabs = ['diag', 'sql', 'mail', 'json'];
  tabs.forEach(t => {
    const view = document.getElementById('aio_view_' + t);
    const btn = document.getElementById('aio_tab_btn_' + t);
    if (view) view.style.display = (t === tabName) ? 'block' : 'none';
    if (btn) {
      btn.style.background = (t === tabName) ? 'rgba(10,132,255,0.25)' : 'transparent';
      btn.style.color = (t === tabName) ? '#7CC0FF' : '#8A9EB3';
    }
  });
};

<script>
/* =========================================================================
   [운영자 전용] 설정 > 계정 조회 : 계정 목록 · 정보 확인 · 비밀번호 초기화 · 7일 이용정지
   ========================================================================= */
window.ACCT_GET_PW = function(email) {
  const k = String(email || '').toLowerCase().trim();
  try {
    const meta = JSON.parse(localStorage.getItem('kem_acct_meta_v1') || '{}');
    if (meta[k] && meta[k].pw) return meta[k].pw;
  } catch(e) {}
  try {
    const accts = JSON.parse(localStorage.getItem('kem_user_accounts') || '[]');
    const found = accts.find(a => String(a.email || '').toLowerCase().trim() === k);
    if (found && found.password) return found.password;
  } catch(e) {}
  const defaults = {
    'vibration200@gmail.com': 'demo-admin-2026!',
    'citizen@k-event.go.kr': 'citizen2026!',
    'admin@k-event.go.kr': 'admin2026!',
    'drafter@k-event.go.kr': 'drafter2026!',
    'approver@k-event.go.kr': 'approver2026!'
  };
  return defaults[k] || '';
};

window.ACCT_SET_PW = function(email, newPw) {
  const k = String(email || '').toLowerCase().trim();
  try {
    const meta = JSON.parse(localStorage.getItem('kem_acct_meta_v1') || '{}');
    meta[k] = Object.assign({}, meta[k] || {}, { pw: newPw, pwAt: Date.now() });
    localStorage.setItem('kem_acct_meta_v1', JSON.stringify(meta));
  } catch(e) {}
  try {
    const accts = JSON.parse(localStorage.getItem('kem_user_accounts') || '[]');
    const idx = accts.findIndex(a => String(a.email || '').toLowerCase().trim() === k);
    if (idx >= 0) {
      accts[idx].password = newPw;
      localStorage.setItem('kem_user_accounts', JSON.stringify(accts));
    }
  } catch(e) {}
};

(function () {
  const MK = 'kem_acct_meta_v1', AK = 'kem_user_accounts', DAY = 864e5, TMP_PW = 'a1234567!';
  let mem = {};
  const rd = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const wr = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const getMeta = () => rd(MK, null) || mem;
  const setMeta = m => { mem = m; wr(MK, m); };
  const RL = {user:['이벤트 참여자','🙋‍♂️','#64D2FF'], draft:['이벤트 생성자','📝','#0A84FF'], appr:['이벤트 승인자','⚖️','#30D158'], admin:['시스템 운영자','👑','#FF9F0A']};
  const rl = r => RL[r] || RL.user;
  const BUILTIN = [
    {email:'vibration200@gmail.com', role:'admin', region:'전국', src:'총괄 운영자 (마스터)'},
    {email:'citizen@k-event.go.kr', role:'user', region:'충청남도', src:'시연 기본 참가자 계정', demo:true},
    {email:'admin@k-event.go.kr', role:'admin', region:'전국', src:'시연 보조 계정', demo:true},
    {email:'drafter@k-event.go.kr', role:'draft', region:'전국', src:'시연 기본 계정', demo:true},
    {email:'approver@k-event.go.kr', role:'appr', region:'전국', src:'시연 기본 계정', demo:true}
  ];
  const UI = {q:'', cloud:[], sub:'', role:'', sel:'', page:0, reason:''};
  window.ACCT_UI = UI;
  const z = n => String(n).padStart(2, '0');
  const fmt = t => { const d = new Date(t); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; };
  const ek = k => encodeURIComponent(k).replace(/'/g, '%27');
  const me = () => String((window.AUTH && AUTH.user && AUTH.user.email) || '').toLowerCase();
  const GN2 = {M:'남성', F:'여성'};

  function list() {
    const out = [], seen = new Set();
    const add = a => { const k = String(a.email || '').toLowerCase(); if (!k || seen.has(k)) return; seen.add(k); out.push(Object.assign({key:k}, a, {name:String(a.email || '')})); };
    rd(AK, []).forEach(a => add({email:a.email, name:a.name, role:a.role, gender:a.gender, birth:a.birth_year, age:a.age_group, region:a.region, created:a.created_at, src:'회원가입', local:true}));
    BUILTIN.forEach(add);
    UI.cloud.forEach(c => {
      const k = 'cloud:' + c.id;
      if (seen.has(k)) return;
      seen.add(k);
      const isMasterUuid = String(c.id).toLowerCase().startsWith('67e6f52e');
      let cloudEmail = '';
      if (isMasterUuid || String(c.display_name || '').includes('vibration200')) {
        cloudEmail = 'vibration200@gmail.com';
      } else if (c.email && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email)) {
        cloudEmail = c.email;
      } else {
        const prefix = (c.display_name && /^[a-zA-Z0-9._-]+$/.test(c.display_name)) ? c.display_name.toLowerCase() : ('user_' + String(c.id).slice(0, 8));
        cloudEmail = `${prefix}@cloud.k-event.go.kr`;
      }
      out.push({
        key: k,
        cloud: true,
        email: cloudEmail,
        name: cloudEmail,
        role: (isMasterUuid || String(c.display_name || '').includes('vibration200')) ? 'admin' : ({drafter:'draft', approver:'appr', citizen:'user'}[c.role] || c.role || 'user'),
        src: 'Supabase 클라우드 계정',
        cloudUid: String(c.id).slice(0, 8)
      });
    });
    if (window.AUTH && AUTH.user && AUTH.user.email) add({email:AUTH.user.email, name:AUTH.user.name, role:AUTH.role || AUTH.appRole || 'admin', src:'현재 접속 계정'});
    return out;
  }
  const find = k => list().find(a => a.key === k);
  const susp = e => { const m = getMeta()[String(e || '').toLowerCase()]; return m && m.until > Date.now() ? m : null; };
  const actor = () => (window.AUTH && AUTH.user && AUTH.user.name) || '운영자';

  /* ---- 화면 (3단계: 역할 그룹 → 계정 목록 → 계정 상세) ---- */
  const PAGE = 8;
  const backBtn = (fn, t) => `<button class="cta g" style="width:auto;padding:8px 14px;font-size:12px;margin:0 0 12px;border-radius:99px" onclick="${fn}">← ${t}</button>`;
  const GROUPS = [['user','이벤트 참여자'], ['draft','이벤트 생성자'], ['appr','이벤트 승인자'], ['admin','시스템 운영자'], ['susp','이용정지 중']];
  const roleTitle = r => r === 'susp' ? ['⛔', '이용정지 중 계정'] : [rl(r)[1], rl(r)[0] + ' 계정'];
  const stBadge = a => susp(a.email) ? '<span class="adm-def-badge" style="background:linear-gradient(135deg,#FF453A,#C21E14);font-size:10px">정지</span>' : '';

  function filtered() {
    const q = UI.q.trim().toLowerCase();
    return list().filter(a => (!UI.role || (UI.role === 'susp' ? susp(a.email) : a.role === UI.role)) && (!q || [a.email, a.region].join(' ').toLowerCase().includes(q)))
      .sort((x, y) => String(x.name || '').localeCompare(String(y.name || ''), 'ko'));
  }
  function row(a) {
    const r = rl(a.role);
    return `<div onclick="ACCT.open('${ek(a.key)}')" style="display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer">
      <div style="font-size:22px;flex:none">${r[1]}</div>
      <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.email)} ${a.key === me() ? '<span class="adm-tag">나</span>' : ''}</div>
        <div style="font-size:11.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${UI.role ? esc(a.region || '전국') : r[0]}</div></div>
      ${stBadge(a)}<div style="color:var(--t3);font-size:18px;flex:none">›</div></div>`;
  }
  function body() {
    const q = UI.q.trim();
    if (!UI.role && !q) {
      const all = list();
      return `<div style="display:grid;gap:10px">${GROUPS.map(g => {
        const n = g[0] === 'susp' ? all.filter(a => susp(a.email)).length : all.filter(a => a.role === g[0]).length, t = roleTitle(g[0]);
        return `<div onclick="ACCT.group('${g[0]}')" style="display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid ${g[0] === 'susp' ? 'rgba(255,69,58,.4)' : 'rgba(255,255,255,.12)'};background:rgba(255,255,255,.04);cursor:pointer">
          <div style="font-size:26px">${t[0]}</div><div style="flex:1"><div style="font-size:14.5px;font-weight:800;color:#fff">${g[1]}</div><div style="font-size:12px;color:var(--t2)">${n}명</div></div><div style="color:var(--t3);font-size:20px">›</div></div>`;
      }).join('')}</div>`;
    }
    const rows = filtered(), pages = Math.max(1, Math.ceil(rows.length / PAGE));
    if (UI.page >= pages) UI.page = pages - 1;
    const cur = rows.slice(UI.page * PAGE, UI.page * PAGE + PAGE);
    let h = `<div style="font-size:12px;color:var(--t2);margin-bottom:4px">총 ${rows.length}명${pages > 1 ? ` · ${UI.page + 1}/${pages} 페이지` : ''}</div>`;
    h += cur.length ? cur.map(row).join('') : '<div class="note" style="text-align:center">조건에 맞는 계정이 없습니다.</div>';
    if (pages > 1) h += `<div style="display:flex;gap:8px;margin-top:12px"><button class="cta g" style="margin:0;padding:10px;font-size:12px;${UI.page ? '' : 'opacity:.4'}" ${UI.page ? '' : 'disabled'} onclick="ACCT.page(${UI.page - 1})">← 이전</button><button class="cta g" style="margin:0;padding:10px;font-size:12px;${UI.page < pages - 1 ? '' : 'opacity:.4'}" ${UI.page < pages - 1 ? '' : 'disabled'} onclick="ACCT.page(${UI.page + 1})">다음 →</button></div>`;
    return h;
  }
  function detail(a) {
    const r = rl(a.role), s = susp(a.email), m = getMeta()[a.key] || {}, self = a.key === me();
    const canSusp = !a.cloud && a.role !== 'admin' && !self, canReset = !a.cloud;
    const row2 = (l, v) => `<div class="asr"><span>${l}</span><b>${v}</b></div>`;
    return `${backBtn('ACCT.up()', UI.role ? '목록으로' : '검색 결과로')}
    <div class="glass sec rv" style="--d:0.02s${s ? ';border-color:rgba(255,69,58,.5)' : ''}">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div style="font-size:34px">${r[1]}</div><div style="min-width:0"><div style="font-size:17px;font-weight:900;color:#fff;word-break:break-all">${esc(a.email)}</div><span class="adm-tag" style="color:${r[2]};border-color:${r[2]}55">${r[0]}</span> ${a.cloud ? '<span class="adm-tag" style="color:#7CC0FF;border-color:rgba(10,132,255,0.4)">클라우드 연동</span>' : ''} ${stBadge(a)}</div></div>
      ${row2('계정 ID (이메일)', esc(a.email))}
      ${a.cloudUid ? row2('클라우드 고유식별자', `<code style="font-size:11px;color:#7CC0FF">${esc(a.cloudUid)}</code>`) : ''}
      ${s ? `<div style="font-size:12.5px;color:#FF8A80;line-height:1.6;margin-bottom:10px;padding:10px;border-radius:12px;background:rgba(255,69,58,.1)">⛔ ${fmt(s.until)} 까지 이용 정지 (남은 ${Math.max(1, Math.ceil((s.until - Date.now()) / DAY))}일)<br>사유: ${esc(s.reason || '-')}${s.by ? '<br>처리: ' + esc(s.by) : ''}</div>` : ''}
            ${row2('이벤트 지역', esc(a.region || '전국'))}${row2('가입일', a.created ? fmt(a.created) : '-')}${row2('가입 경로', esc(a.src))}
      <div class="asr"><span>비밀번호</span><div style="display:flex;align-items:center;gap:8px"><b id="pw_disp_${ek(a.key)}" style="font-family:monospace;font-size:14px;letter-spacing:1px">••••••••</b><button type="button" class="cta g" style="margin:0;padding:4px 9px;font-size:11px;width:auto;border-radius:6px;border-color:rgba(10,132,255,0.4);color:#7CC0FF" onclick="ACCT.togglePw('${ek(a.key)}')">👁️ 보기</button></div></div>
      ${row2('계정 상태', s ? '<span style="color:#FF8A80">정지 중</span>' : '<span style="color:#4CE070">정상</span>')}
      ${row2('조치 이력', `정지 ${m.cnt || 0}회${m.pwAt ? `<small>마지막 비밀번호 초기화 ${fmt(m.pwAt)}</small>` : ''}`)}</div>
    <div class="glass sec rv" style="--d:0.05s"><h2 style="font-size:14px;margin:0 0 10px">운영자 조치</h2>
      <button class="cta" style="margin:0 0 8px;background:linear-gradient(135deg,#0A84FF,#0066d6);${canReset ? '' : 'opacity:.4'}" onclick="ACCT.changePwAsk('${ek(a.key)}')">✏️ 비밀번호 직접 변경</button>
      <button class="cta" style="margin:0 0 8px;background:linear-gradient(135deg,#30D158,#1A9338);${canReset ? '' : 'opacity:.4'}" onclick="ACCT.resetAsk('${ek(a.key)}')">🔑 임시 비밀번호로 초기화 (${TMP_PW})</button>
      ${s ? `<button class="cta" style="margin:0;background:linear-gradient(135deg,#FF9F0A,#E07A00)" onclick="ACCT.unsuspend('${ek(a.key)}')">정지 해제</button>`
          : `<button class="cta" style="margin:0;background:linear-gradient(135deg,#FF453A,#FF2D55);${canSusp ? '' : 'opacity:.4'}" onclick="ACCT.suspendAsk('${ek(a.key)}')">⛔ 부정 사용자 7일 정지</button>`}
      ${canReset && canSusp ? '' : `<div class="note" style="font-size:11.5px;margin-top:10px">${a.cloud ? '클라우드 계정은 조회 전용입니다.' : '시연 기본·운영자·본인 계정은 일부 조치가 제한됩니다.'}</div>`}</div>`;
  }
  function view() {
    if (UI.sel) { const a = find(UI.sel); if (a) return detail(a); UI.sel = ''; }
    const top = !UI.role && !UI.q.trim() ? '' : '';
    const t = UI.role ? roleTitle(UI.role) : ['👥', '계정 조회'];
    return `<section class="hero rv" style="--d:0.02s;min-height:0;padding-bottom:8px">
      ${UI.role ? backBtn('ACCT.up()', '계정 조회') : backBtn('ACCT.back()', '설정으로')}
      <div class="eyebrow" style="color:#FFB340;background:rgba(255,159,10,.15)">운영자 전용</div>
      <h1 style="font-size:23px;line-height:1.25">${t[0]} ${t[1]}</h1>

    <div class="glass sec rv" style="--d:0.04s">
      <input class="in" id="acct_q" placeholder="계정 ID(이메일) · 지역 검색" value="${esc(UI.q)}" oninput="ACCT.search(this.value)" style="margin-bottom:12px">
      <div id="acct_body">${body()}</div></div>`;
  }
  function menu() {
    const all = list(), sc = all.filter(a => susp(a.email)).length;
    return `<div class="glass sec rv" style="--d:0.03s;border-color:rgba(255,159,10,.45);background:linear-gradient(135deg,rgba(255,159,10,.1),rgba(15,25,45,.9))">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h2 style="font-size:14px;margin:0;color:#FFB340">👥 계정 조회</h2><span class="tgs pend" style="font-size:10px">운영자 전용</span></div>
      <p style="font-size:12px;color:var(--t2);margin:0 0 12px;line-height:1.5">역할별 계정 조회 · 비밀번호 초기화 · 부정 사용자 7일 정지<br>현재 <b style="color:#fff">${all.length}</b>개 계정${sc ? ` · <b style="color:#FF8A80">정지 중 ${sc}</b>` : ''}</p>
      <button class="cta" style="margin:0;padding:12px;font-size:13px;background:linear-gradient(135deg,#FF9F0A,#E07A00)" onclick="ACCT.openView()">계정 조회 열기 ➔</button></div>`;
  }

  /* ---- 모달 ---- */
  const modal = h => { const b = $('#role_modal_box'); if (!b) return; b.style.display = 'block'; b.innerHTML = `<div class="role-modal-ov" onclick="if(event.target===this)closeRoleModal()"><div class="role-modal" style="max-width:360px;max-height:88vh;overflow-y:auto">${h}</div></div>`; };
  const head = (t, c) => `<h3 style="margin:0 0 12px;font-size:16px;font-weight:800;color:${c || '#fff'};display:flex;justify-content:space-between;align-items:center">${t}<button onclick="closeRoleModal()" style="border:0;background:none;color:var(--t2);font-size:20px;cursor:pointer;padding:0 4px">✕</button></h3>`;
  const refresh = () => { const l = $('#acct_list'); if (l) l.innerHTML = listHtml(); const c = $('#acct_chips'); if (c || $('#acct_q')) go('mo', 1); };

  const A = window.ACCT = {
    suspInfo: e => { const s = susp(e); return s ? {until:fmt(s.until), reason:s.reason || ''} : null; },
    menu, view,
    openView() { UI.sub = 'accounts'; UI.role = ''; UI.sel = ''; UI.q = ''; UI.page = 0; go('mo'); A.loadCloud(); },
    back() { UI.sub = ''; go('mo'); },
    group(r) { UI.role = r; UI.q = ''; UI.page = 0; go('mo'); },
    open(k) { UI.sel = decodeURIComponent(k); go('mo'); },
    up() { if (UI.sel) UI.sel = ''; else { UI.role = ''; UI.q = ''; UI.page = 0; } go('mo'); },
    page(n) { UI.page = n; A.paint(); },
    paint() { const b = $('#acct_body'); if (b) b.innerHTML = body(); },
    search(v) { UI.q = v; UI.page = 0; A.paint(); },
    async loadCloud() {
      try {
        if (!window.AUTH || !AUTH.rest) return;
        const r = await AUTH.rest('profiles?select=id,display_name,role,is_active&order=created_at.desc&limit=30');
        if (r && r.ok && Array.isArray(r.data)) { UI.cloud = r.data; if (UI.sub === 'accounts' && !UI.sel && tab === 'mo') go('mo', 1); }
      } catch (e) {}
    },
    info(k) {
      const a = find(decodeURIComponent(k)); if (!a) return;
      const r = rl(a.role), s = susp(a.email), m = getMeta()[a.key] || {};
      const row = (l, v) => `<div class="asr"><span>${l}</span><b>${v}</b></div>`;
      modal(head(`${r[1]} 계정 정보`, '#FFB340') +
        row('계정 ID (이메일)', esc(a.email)) + row('역할', `<span style="color:${r[2]}">${r[0]}</span>`) +
        row('성별', GN2[a.gender] || '미선택') + row('출생·연령대', a.birth ? `${a.birth}년 · ${esc(a.age || '')}` : '-') +
        row('이벤트 지역', esc(a.region || '전국')) + row('가입일', a.created ? fmt(a.created) : '-') + row('가입 경로', esc(a.src)) +
        `<div class="asr"><span>비밀번호</span><div style="display:flex;align-items:center;gap:8px"><b id="pw_disp_m_${ek(a.key)}" style="font-family:monospace;font-size:14px;letter-spacing:1px">••••••••</b><button type="button" class="cta g" style="margin:0;padding:4px 9px;font-size:11px;width:auto;border-radius:6px;border-color:rgba(10,132,255,0.4);color:#7CC0FF" onclick="ACCT.togglePw('${ek(a.key)}', true)">👁️ 보기</button></div></div>` +
        row('계정 상태', s ? `<span style="color:#FF8A80">정지 중 (~${fmt(s.until)})</span><small>사유: ${esc(s.reason || '-')}</small>` : '<span style="color:#4CE070">정상</span>') +
        row('조치 이력', `정지 ${m.cnt || 0}회${m.pwAt ? `<small>마지막 비밀번호 초기화 ${fmt(m.pwAt)}</small>` : ''}`) +
        `<button class="cta g" style="margin-top:14px;padding:11px" onclick="closeRoleModal()">닫기</button>`);
    },
    resetAsk(k) {
      const a = find(decodeURIComponent(k)); if (!a) return;
      if (a.cloud) return toast('클라우드 계정은 조회 전용입니다.');
      modal(head('비밀번호 초기화', '#5EE880') +
        `<p style="font-size:13px;color:var(--t2);line-height:1.6;margin:0 0 14px"><b style="color:#fff">${esc(a.email)}</b> 계정의 비밀번호를 <b style="color:#5EE880">${TMP_PW}</b> 로 초기화합니다.</p>
         <button class="cta" style="margin:0;background:linear-gradient(135deg,#30D158,#1A9338)" onclick="ACCT.reset('${ek(a.key)}')">초기화 실행</button>
         <button class="cta g" style="margin-top:8px;padding:11px" onclick="closeRoleModal()">취소</button>`);
    },
    reset(k) {
      const key = decodeURIComponent(k), a = find(key);
      if (!a) return toast('계정을 찾을 수 없습니다.');
      window.ACCT_SET_PW(key, TMP_PW);
      addAuditLog('admin', 'sec', `계정 비밀번호 초기화: [${a.email}]`, `대상: ${a.email} (${rl(a.role)[0]}) · 운영자 직권으로 임시 비밀번호 발급 · 임시비번: ${TMP_PW}`, 'ACTION: PW_RESET');
      modal(head('초기화 완료', '#5EE880') +
        `<div style="text-align:center;padding:6px 0 14px"><div style="font-size:30px">🔑</div><p style="font-size:13px;color:var(--t2);line-height:1.6;margin:8px 0 10px"><b style="color:#fff">${esc(a.email)}</b> 계정의 임시 비밀번호</p>
         <div style="font-size:22px;font-weight:900;letter-spacing:1px;color:#5EE880;background:rgba(48,209,88,.1);border:1px dashed rgba(48,209,88,.4);border-radius:12px;padding:12px">${TMP_PW}</div>
         <p style="font-size:11.5px;color:var(--t3);margin:10px 0 0">임시 비밀번호로 초기화되었습니다. 로그인 후 변경해 주세요.</p></div>
         <button class="cta g" style="margin:0;padding:11px" onclick="closeRoleModal()">확인</button>`);
      toast('비밀번호가 초기화되었습니다.'); go('mo', 1);
    },
    togglePw(k, inModal) {
      const key = decodeURIComponent(k);
      const targetId = inModal ? 'pw_disp_m_' + ek(key) : 'pw_disp_' + ek(key);
      const el = document.getElementById(targetId);
      const btn = event.currentTarget || event.target;
      if (!el) return;
      if (el.dataset.show === '1') {
        el.textContent = '••••••••';
        el.dataset.show = '0';
        if (btn) btn.textContent = '👁️ 보기';
      } else {
        el.textContent = window.ACCT_GET_PW(key);
        el.dataset.show = '1';
        if (btn) btn.textContent = '🙈 숨기기';
      }
    },
    changePwAsk(k) {
      const a = find(decodeURIComponent(k)); if (!a) return;
      if (a.cloud) return toast('클라우드 계정은 조회 전용입니다.');
      const curPw = window.ACCT_GET_PW(a.email);
      modal(head('비밀번호 직접 변경', '#7CC0FF') +
        `<p style="font-size:13px;color:var(--t2);line-height:1.6;margin:0 0 12px"><b style="color:#fff">${esc(a.email)}</b> 계정의 비밀번호를 변경합니다.</p>
         <label class="fld" style="margin-bottom:10px">
           <span style="font-size:12px;color:#7CC0FF">현재 저장된 비밀번호</span>
           <input class="in" type="text" value="${esc(curPw)}" readonly style="opacity:0.85;font-family:monospace;background:rgba(255,255,255,0.06);color:#5EE880;font-weight:700">
         </label>
         <label class="fld" style="margin-bottom:16px">
           <span style="font-size:12px;color:#7CC0FF">새로운 비밀번호 입력 *</span>
           <input class="in" type="text" id="new_pw_input" placeholder="새 비밀번호 입력 (4자 이상)" value="${a.email === 'vibration200@gmail.com' ? 'demo-admin-2026!' : ''}" style="font-family:monospace;font-weight:700">
         </label>
         <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
           <button class="cta" style="margin:0;width:100%;height:44px;font-size:14px;background:linear-gradient(135deg,#0A84FF,#30D158);border-radius:12px;display:flex;align-items:center;justify-content:center" onclick="ACCT.changePw('${ek(a.key)}')">비밀번호 변경 저장</button>
           <button class="cta g" style="margin:0;width:100%;height:40px;font-size:13px;border-radius:12px;display:flex;align-items:center;justify-content:center" onclick="closeRoleModal()">취소</button>
         </div>`);
    },
    changePw(k) {
      const key = decodeURIComponent(k), a = find(key); if (!a) return;
      const inp = document.getElementById('new_pw_input');
      const newPw = inp ? inp.value.trim() : '';
      if (!newPw || newPw.length < 4) return toast('새 비밀번호를 4자 이상 입력해 주세요.');
      window.ACCT_SET_PW(key, newPw);
      addAuditLog('admin', 'sec', `계정 비밀번호 직접 변경: [${a.email}]`, `대상: ${a.email} (${rl(a.role)[0]}) · 운영자 직권 비밀번호 변경 완료`, 'ACTION: PW_CHANGE');
      closeRoleModal();
      toast(`[${a.email}] 비밀번호가 ${newPw}로 변경되었습니다.`);
      go('mo', 1);
    },
    suspendAsk(k) {
      const a = find(decodeURIComponent(k)); if (!a) return;
      if (a.cloud) return toast('클라우드 계정은 조회 전용입니다.');
      if (a.role === 'admin' || a.key === me()) return toast('운영자 계정과 본인 계정은 정지할 수 없습니다.');
      UI.reason = '';
      const rs = ['매크로·봇 응모', '다중 계정 중복 응모', '허위 정보 입력', '명의도용 의심', '기타 부정 사용'];
      modal(head('부정 사용자 7일 이용정지', '#FF6B60') +
        `<p style="font-size:13px;color:var(--t2);line-height:1.6;margin:0 0 10px"><b style="color:#fff">${esc(a.email)}</b><br>지금부터 <b style="color:#FF8A80">7일간</b> 로그인이 차단됩니다.</p>
         <div class="chips sm" id="sus_chips" style="margin-bottom:10px">${rs.map(x => `<button data-r="${esc(x)}" onclick="ACCT.pickReason(this)">${x}</button>`).join('')}</div>
         <input class="in" id="sus_extra" placeholder="추가 사유 (선택)" style="margin-bottom:14px">
         <button class="cta" style="margin:0;background:linear-gradient(135deg,#FF453A,#FF2D55)" onclick="ACCT.suspend('${ek(a.key)}')">7일 정지 실행</button>
         <button class="cta g" style="margin-top:8px;padding:11px" onclick="closeRoleModal()">취소</button>`);
    },
    pickReason(b) { UI.reason = b.dataset.r; document.querySelectorAll('#sus_chips button').forEach(x => x.classList.toggle('on', x === b)); },
    suspend(k) {
      const key = decodeURIComponent(k), a = find(key); if (!a) return;
      const extra = (($('#sus_extra') || {}).value || '').trim(), reason = [UI.reason, extra].filter(Boolean).join(' · ');
      if (!reason) return toast('정지 사유를 선택하거나 입력해 주세요.');
      const m = getMeta(), prev = m[key] || {}, until = Date.now() + 7 * DAY;
      m[key] = Object.assign({}, prev, {until, reason, at:Date.now(), by:actor(), cnt:(prev.cnt || 0) + 1}); setMeta(m);
      addAuditLog('admin', 'sec', `부정 사용자 7일 이용정지: [${a.email}]`, `대상: ${a.email} (${rl(a.role)[0]}) · 사유: ${reason} · 정지 해제 예정: ${fmt(until)}`, 'ACTION: SUSPEND_7D');
      closeRoleModal(); toast(`${a.email} 계정을 7일간 정지했습니다.`); go('mo', 1);
    },
    unsuspend(k) {
      const key = decodeURIComponent(k), a = find(key), m = getMeta(); if (!a || !m[key]) return;
      m[key] = Object.assign({}, m[key], {until:0, releasedAt:Date.now()}); setMeta(m);
      addAuditLog('admin', 'sec', `이용정지 조기 해제: [${a.email}]`, `대상: ${a.email} · 운영자 직권 해제`, 'ACTION: SUSPEND_RELEASE');
      toast(`${a.email} 계정의 정지를 해제했습니다.`); go('mo', 1);
    }
  };
})();
</script>

</body>
</html>
