name: K-Gift Hunter Automation (24/7 Free Live Sync)

on:
  workflow_dispatch: # GitHub 웹 UI에서 [Run workflow] 버튼으로 즉시 실행 가능
  schedule:
    # 6시간마다 매일 자동 실행 (UTC 00, 06, 12, 18시 -> 한국시간 09, 15, 21, 03시)
    - cron: '0 0,6,12,18 * * *'
  push:
    paths:
      - 'kgift_hunter.py'
      - 'kgift_checker.py'
      - 'sources_gyeonggi.json'
      - '.github/workflows/hunter.yml'

jobs:
  hunt-and-verify:
    name: Crawl, Free OCR, K-Checker Verify & Supabase Sync
    runs-on: ubuntu-latest

    permissions:
      contents: write # events.json 업데이트 커밋/푸시 권한

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Free Tesseract OCR (Korean & English)
        run: |
          echo "=== 100% 무료 Tesseract 한글 OCR 패키지 설치 ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor
          pip install --quiet pytesseract pillow

      - name: Run K-Gift Hunter with Free OCR & Supabase Sync
        run: |
          echo "=== K-Gift Hunter 실시간 수집 및 K-Checker 무결성 검증 ==="
          python -X utf8 kgift_hunter.py --ocr

      - name: Commit and Push Updated Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "K-Gift Bot"
          git add events.json events_review.json log.txt period_debug.txt
          git diff-index --quiet HEAD || git commit -m "auto: 실시간 이벤트 수집 및 K-Checker 검증 완료 [skip ci]"
          git push || echo "No changes to commit"
