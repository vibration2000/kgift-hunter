<script>
function showRealPage(){
	$("#waitPage").css("display","none");
}

function showWaitPage(type){
	$("#waitPage").css("display","block");
	$("#isWaitPage").css("display","none");
	$("#isRejectPage").css("display","none");
	$("#isNotUse").css("display","none");
	
	if ( type == 'W' ){
		$("#isWaitPage").css("display","block");
	} else if ( type == 'NE' ){
		$("#isNotUse").css("display","block");
	} else if ( type == 'R' ){
		$("#isRejectPage").css("display","block");
	}
}

function checkInAPI(){
	var host = "www.suwon.go.kr";
	var port = "80";
	var pageUrl = "/index.do" || document.location.pathname;	// 현재 페이지 정보
	pageUrl = tracerPageUrlReplace(pageUrl);
	var ip = "172.169.254.182";	// 클라이언트 IP
	var loginId = "172.169.254.182";	// 클라이언트 IP 또는 로그인 ID

	callTracerApiInput(host, ip, loginId, port, pageUrl, this);
}

function checkOutAPI(){
	var host = "www.suwon.go.kr";
	var port = "80";
	var pageUrl = "/index.do" || document.location.pathname;	// 현재 페이지 정보
	pageUrl = tracerPageUrlReplace(pageUrl);
	var ip = "172.169.254.182";	// 클라이언트 IP
	var loginId = "172.169.254.182";	// 클라이언트 IP 또는 로그인 ID

	callTracerApiOutput(host, ip, loginId, port, pageUrl, this);
}

function callBackTracer(){
    
		document.location.replace('/index.do');
	
}

function tracerPageUrlReplace(url){
    if(url != null && url != ''){
        url = url.replace(/(http|https)(:\/\/)(.*?)(\/)/g, '/');
    }
    return url;
}

function checkCntData(){
	var host = this_host;
	var ip =  this_ip;
	var loginId = this_loginId;
	var port = this_port;
	var pageUrl = this_pageUrl;
	var sendThis = this_sendThis;

	callTracerApiInputData(host, ip, loginId, port, pageUrl, sendThis);

	var waitCnt = this_waitCnt;
	
	if ( waitCnt == "0" || waitCnt == "E"){
		showRealPage();
		callBackTracer();
	} else{
		var $el = $("#wait_value");
		var waitCnt = this_waitCnt;
		if ( $.isNumeric(waitCnt) ){
			$el.html("고객님의 대기순번은 <span class=\"wait_cnt\">"+comma(Math.floor(waitCnt))+"</span> 명입니다.");
		} else{
			// alert("AAA"+opener.this_waitCnt+"AAA");
		}
	}

}

playAlert = setInterval(function(){
	if ( this_isWait == "T" ){
		checkCntData();
	}
}, 1000);

$(document).ready(function(){
	var $el = $("#wait_value");
	$el.html("고객님의 대기순번을 확인중입니다.");
	//checkCntData();
});

function comma(num){
	var len, point, str;

	num = num + "";
	point = num.length % 3 ;
	len = num.length;

	str = num.substring(0, point);
	while (point < len){
		if (str != "") str += ",";
		str += num.substring(point, point + 3);
		point += 3; 
	} 

	return str;
}

$(document).ready(function(){
	$('head').append($('#tracerApiTemplate').html());
	$('#tracerApiTemplate').remove();
	checkInAPI();
});
</script>
